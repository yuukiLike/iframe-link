<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parent App - Delayed Connection Test</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; }
    .panel { border: 1px solid #ccc; padding: 15px; border-radius: 8px; max-width: 600px; }
    iframe { width: 100%; height: 150px; border: 1px solid #ddd; }
    .log { background: #f5f5f5; padding: 10px; margin-top: 10px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; }
    .log-item { margin: 2px 0; }
    .success { color: green; }
    .error { color: red; }
    .info { color: #666; }
  </style>
</head>
<body>
  <!--
  ═══════════════════════════════════════════════════════════════════════════════
  E2E 测试：延迟连接场景
  ═══════════════════════════════════════════════════════════════════════════════

  测试目的：验证重试机制
  ────────────────────────
  子页面延迟 2 秒才初始化 SDK。
  父页面的重试机制应该能成功建立连接。

  时序：
  ────────
  0.0s: 父页面 connectToIframe() - 开始监听
  0.0s: 子页面加载完成，但还没初始化 SDK
  2.0s: 子页面 connectToParent() - 发送 READY
  2.0s: 父页面收到 READY，回复 ACK
  2.0s: 握手完成

  预期：即使子应用延迟 2 秒，连接也能成功建立。

  ═══════════════════════════════════════════════════════════════════════════════
  -->

  <h1>Delayed Connection Test</h1>

  <div class="panel">
    <h3>Child (delays 2s before connecting)</h3>
    <iframe id="delayed-iframe" src="child-delayed.html"></iframe>
    <div id="log" class="log"></div>
  </div>

  <script type="module">
    import { connectToIframe } from '../../../dist/index.js'

    const ORIGIN = window.location.origin
    const log = document.getElementById('log')
    const iframe = document.getElementById('delayed-iframe')

    function addLog(message, type = '') {
      const item = document.createElement('div')
      item.className = `log-item ${type}`
      item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`
      log.appendChild(item)
      log.scrollTop = log.scrollHeight
    }

    addLog('Parent: connectToIframe() called, waiting for child...', 'info')

    const startTime = Date.now()

    const channel = connectToIframe({
      iframe: iframe,
      origin: ORIGIN,
      methods: {
        parentMethod: async (params) => {
          addLog(`parentMethod called: ${JSON.stringify(params)}`)
          return { fromParent: true }
        }
      },
      debug: true
    })

    channel.promise.then((remote) => {
      const elapsed = Date.now() - startTime
      addLog(`Connected! (took ${elapsed}ms)`, 'success')

      window.remote = remote
      window.channel = channel
      window.connectionTime = elapsed
    }).catch((err) => {
      addLog(`Connection failed: ${err.message}`, 'error')
    })

    // 暴露测试 API
    window.testAPI = {
      getChannel: () => channel,
      getStartTime: () => startTime,
      addLog
    }
  </script>
</body>
</html>
